name: อัปเดตข้อมูลน้ำ

on:
  schedule:
    - cron: "7,37 * * * *" # ทุก 30 นาที (GitHub อาจดีเลย์ได้หลายนาที)
  workflow_dispatch: {}      # กดรันเองได้จากแท็บ Actions
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ดึงข้อมูลประวัติเดิมจากสาขา gh-pages (ถ้ายังไม่มี = รอบแรก)
      - name: ดึงประวัติเดิม
        run: |
          mkdir -p prev
          git fetch --depth 1 origin gh-pages && git --work-tree=prev checkout origin/gh-pages -- data || echo "ยังไม่มีข้อมูลเดิม"

      - name: ดึงข้อมูลจากต้นทาง
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.mjs --prev prev/data --out out/data

      - name: รวมไฟล์หน้าเว็บ
        run: |
          cp -r site/. out/
          touch out/.nojekyll
          test -f out/data/latest.json || cp -r prev/data/. out/data/

      - name: เผยแพร่ขึ้น GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true # เก็บแค่คอมมิตเดียว repo จะไม่บวมขึ้นเรื่อยๆ
          commit_message: "อัปเดตข้อมูล"

      # GitHub จะปิด workflow ตั้งเวลาอัตโนมัติถ้า repo ไม่มีความเคลื่อนไหว 60 วัน
      # ขั้นนี้สั่งเปิดใช้งานซ้ำทุกวันที่ 1 เพื่อไม่ให้ระบบหยุดเงียบๆ
      - name: กันไม่ให้ workflow ถูกปิด
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
          fi

      - name: แจ้งสถานะถ้าดึงข้อมูลไม่สำเร็จ
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::ดึงข้อมูลบางแหล่งไม่สำเร็จ หน้าเว็บใช้ข้อมูลรอบก่อนแทน"
